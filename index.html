<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="author" content="zhanheng">
  <meta name="description" content="Personal homepage of zhanheng. Email: zhanheng288@gmail.com. GitHub: Ceasar-back.">
  <title>zhanheng — Personal homepage</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 64px 28px;
      background: #fafaf8;
      color: #252823;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    main { width: 100%; max-width: 520px; }

    h1 {
      margin: 0;
      font-size: clamp(48px, 10vw, 72px);
      font-weight: 500;
      line-height: 1.1;
      letter-spacing: -0.055em;
    }

    .subtitle {
      margin: 16px 0 42px;
      color: #686e64;
      font-size: 15px;
      line-height: 1.6;
    }

    dl {
      display: grid;
      grid-template-columns: 76px minmax(0, 1fr);
      gap: 20px 24px;
      margin: 0;
      padding-top: 28px;
      border-top: 1px solid #dcdfd6;
      font-size: 15px;
      line-height: 1.6;
    }

    dt { color: #686e64; }
    dd { margin: 0; min-width: 0; }

    a {
      color: inherit;
      text-decoration: underline;
      text-decoration-color: #b2b8ac;
      text-underline-offset: 5px;
      text-decoration-thickness: 1px;
      overflow-wrap: anywhere;
    }

    a:hover { text-decoration-color: currentColor; }
    a:focus-visible { outline: 2px solid #252823; outline-offset: 6px; border-radius: 2px; }
    ::selection { background: #e0e5d8; }

    @media (max-width: 420px) {
      dl { grid-template-columns: 1fr; gap: 6px; }
      dd + dt { margin-top: 18px; }
    }
  </style>
</head>
<body>
  <main aria-labelledby="name">
    <header>
      <h1 id="name">zhanheng</h1>
      <p class="subtitle">Personal homepage</p>
    </header>
    <dl>
      <dt>Email</dt>
      <dd><a href="mailto:zhanheng288@gmail.com">zhanheng288@gmail.com</a></dd>
      <dt>GitHub</dt>
      <dd><a href="https://github.com/Ceasar-back">Ceasar-back</a></dd>
    </dl>
  </main>
</body>
</html>
